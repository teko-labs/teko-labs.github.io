<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teko Labs</title>
<meta name="description" content="Teko Labs makes small, friendly games for phones. Play your way.">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;800&display=swap">
<style>
  :root { --ground: #121428; --accent: #f04a2a; --light: #f4efe6; --soft: rgba(244, 239, 230, 0.62); }
  html, body { margin: 0; background: var(--ground); color: var(--light); font-family: Unbounded, system-ui, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box; text-align: center; }
  .mark { width: 132px; height: 132px; display: block; }
  h1 { margin: 28px 0 0; font-size: clamp(40px, 8vw, 72px); line-height: 1; letter-spacing: -0.01em; }
  h1 b { font-weight: 800; }
  h1 span { font-weight: 300; margin-left: 0.22em; }
  .tagline { margin: 18px 0 0; font-weight: 300; font-size: 14px; letter-spacing: 0.32em; color: var(--soft); text-transform: uppercase; }
  .games { margin: 64px 0 0; display: flex; flex-direction: column; gap: 14px; width: min(100%, 420px); }
  .game { display: flex; align-items: center; gap: 18px; padding: 16px 20px; border-radius: 18px; background: rgba(244, 239, 230, 0.06); color: var(--light); text-decoration: none; text-align: left; transition: background 0.15s; }
  .game:hover { background: rgba(244, 239, 230, 0.12); }
  .game img { width: 56px; height: 56px; border-radius: 14px; flex: none; }
  .game strong { display: block; font-weight: 800; font-size: 17px; }
  .game small { display: block; margin-top: 4px; font-weight: 300; font-size: 12px; color: var(--soft); line-height: 1.5; }
  footer { margin-top: 72px; font-weight: 300; font-size: 12px; color: var(--soft); line-height: 2; }
  footer a { color: var(--soft); }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 120 120" role="img" aria-label="The Teko Labs mark">
    <polygon points="60,8 94,42 26,42" fill="#f04a2a" stroke="#f04a2a" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="10,58 52,58 52,104 8,60" fill="#f4efe6" stroke="#f4efe6" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="68,58 110,58 112,60 68,104" fill="#f4efe6" stroke="#f4efe6" stroke-width="4" stroke-linejoin="round"/>
  </svg>
  <h1><b>teko</b><span>labs</span></h1>
  <p class="tagline">Play your way</p>

  <nav class="games" aria-label="Games">
    <a class="game" href="/inky-quest/">
      <img src="/inky-quest/icon.svg" alt="">
      <span><strong>Inky Quest</strong><small>A bounce puzzle for phones. Steer Inky the octopus, match her colour to break the tiles, then take the pearls. Coming to Android first.</small></span>
    </a>
  </nav>
</main>
<footer>
  <p>Teko Labs · <a href="mailto:tekolabs.dev@gmail.com">tekolabs.dev@gmail.com</a><br>© 2026 Teko Labs · <a href="/inky-quest/privacy.html">Inky Quest privacy policy</a></p>
</footer>
</body>
</html>
